name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Required so the release step can create a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17

      # Install the Android SDK manually (the android-actions/setup-android action
      # is broken: it runs `sdkmanager tools`, which Google has removed).
      - name: Setup Android SDK
        run: |
          ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -s -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: Copy web into Android assets
        run: |
          ASSETS=android/app/src/main/assets/web
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp -r web/dist/* "$ASSETS"/

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ---- Release builds (tags only): restore the signing key from secrets ----
      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GOTO_KEYSTORE_BASE64: ${{ secrets.GOTO_KEYSTORE_BASE64 }}
        run: echo "$GOTO_KEYSTORE_BASE64" | base64 -d > "$HOME/release.keystore"

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_HOME: /home/runner/android-sdk
          GOTO_KEYSTORE_FILE: /home/runner/release.keystore
          GOTO_KEYSTORE_PASSWORD: ${{ secrets.GOTO_KEYSTORE_PASSWORD }}
          GOTO_KEY_ALIAS: ${{ secrets.GOTO_KEY_ALIAS }}
          GOTO_KEY_PASSWORD: ${{ secrets.GOTO_KEY_PASSWORD }}
        run: |
          unset ANDROID_SDK_ROOT
          cd android && ./gradlew :app:assembleRelease --no-daemon

      # ---- Debug builds (non-tag pushes): no signing needed ----
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          unset ANDROID_SDK_ROOT
          cd android && ./gradlew :app:assembleDebug --no-daemon

      # Copy the built APK to a versioned, easy-to-track name:
      #   etng_goto_v<semVer>_<versionCode>.apk        (release, published to Releases)
      #   etng_goto_v<semVer>_<versionCode>_debug.apk  (debug, build artifact only)
      # The original app-release / app-debug APK is kept so local `make install` works.
      - name: Rename APK with version
        id: rename
        run: |
          D=android/app/build/outputs/apk
          if [ -f "$D/release/app-release.apk" ]; then
            SRC="$D/release/app-release.apk"; SUFFIX=""
          else
            SRC="$D/debug/app-debug.apk"; SUFFIX="_debug"
          fi
          VERSION_NAME=$(grep -oE 'versionName = "[^"]+"' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -oE 'versionCode = [0-9]+' android/app/build.gradle.kts | sed -E 's/.*([0-9]+).*/\1/')
          NAME="etng_goto_v${VERSION_NAME}_${VERSION_CODE}${SUFFIX}.apk"
          cp "$SRC" "$D/$NAME"
          echo "apk_name=$NAME" >> "$GITHUB_ENV"
          echo "Renamed APK -> $NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.apk_name }}
          path: android/app/build/outputs/apk/${{ env.apk_name }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: android/app/build/outputs/apk/${{ env.apk_name }}
          generate_release_notes: true
